<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" width="1240" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1c1917">L2 · State machines: conversation and capacity</text><rect x="30" y="80" width="160" height="44" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="42" y="101" font-size="13" font-weight="700" fill="#57534e">NEW</text><rect x="200" y="80" width="160" height="44" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="212" y="101" font-size="13" font-weight="700" fill="#7e22ce">NEED_SHIPMENT</text><rect x="400" y="80" width="160" height="44" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="412" y="101" font-size="13" font-weight="700" fill="#7e22ce">NEED_ETA</text><rect x="580" y="80" width="160" height="44" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="592" y="101" font-size="13" font-weight="700" fill="#57534e">OPTIONS_SHOWN</text><rect x="800" y="50" width="160" height="44" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/><text x="812" y="71" font-size="13" font-weight="700" fill="#047857">CONFIRMED</text><rect x="800" y="120" width="190" height="44" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="812" y="141" font-size="13" font-weight="700" fill="#57534e">PENDING_WAREHOUSE</text><rect x="400" y="190" width="160" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="412" y="211" font-size="13" font-weight="700" fill="#b45309">ESCALATED</text><rect x="30" y="190" width="160" height="44" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="42" y="211" font-size="13" font-weight="700" fill="#57534e">CLOSED</text><path d="M190,102 L200,102" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><path d="M360,102 L400,102" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="380" y="125" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">shipment</text><text x="380" y="139" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">known</text><path d="M560,102 L580,102" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="570" y="74" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">ETA known</text><path d="M740,95 L800,72" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="765" y="50" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">pick + commit</text><path d="M740,110 L800,142" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="700" y="150" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">LOW conf / conflict /</text><text x="700" y="164" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">after 21:00</text><path d="M640,124 L480,190" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/><text x="520" y="150" font-size="11.5" fill="#b45309" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">no feasible slot</text><path d="M110,124 L400,212" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#a)"/><text x="220" y="262" font-size="11.5" fill="#b45309" font-weight="400" text-anchor="start">safety · asks for a person · unclear after 2 tries · guard block</text><path d="M800,158 L900,200" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="860" y="215" font-size="11.5" fill="#b45309" font-weight="400" text-anchor="start">coordinator approves (re-validated) / rejects</text><text x="30" y="280" font-size="15" fill="#1c1917" font-weight="700" text-anchor="start">Capacity</text><rect x="30" y="300" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="42" y="321" font-size="13" font-weight="700" fill="#0369a1">SHOWN</text><rect x="230" y="300" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="242" y="321" font-size="13" font-weight="700" fill="#0369a1">HELD 5 min</text><rect x="450" y="300" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="462" y="321" font-size="13" font-weight="700" fill="#0369a1">PENDING ≤20 min</text><rect x="690" y="300" width="180" height="44" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/><text x="702" y="321" font-size="13" font-weight="700" fill="#047857">CONFIRMED</text><rect x="910" y="300" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="922" y="321" font-size="13" font-weight="700" fill="#0369a1">RELEASED / EXPIRED</text><path d="M210,322 L230,322" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="220" y="360" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">hold_slot</text><path d="M410,322 L450,322" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="430" y="360" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">confirm</text><text x="430" y="374" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">(approval)</text><path d="M630,322 L690,322" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="660" y="360" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">approve</text><path d="M870,322 L910,322" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="890" y="362" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">TTL / reject /</text><text x="890" y="376" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">certain miss</text><text x="30" y="395" font-size="12.5" fill="#1c1917" font-weight="400" text-anchor="start">Options shown hold nothing. Only a hold reserves capacity; every commit re-checks feasibility inside a write transaction,</text><text x="30" y="413" font-size="12.5" fill="#1c1917" font-weight="400" text-anchor="start">so a stale option fails safely (OPTION_GONE → fresh options). With no approval needed, HELD goes straight to CONFIRMED.</text></svg>