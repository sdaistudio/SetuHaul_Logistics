<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1c1917">L2 · Components: model.py / tool.py / database.py</text><rect x="20" y="54" width="380" height="560" rx="14" fill="none" stroke="#7e22ce" stroke-width="1.3" stroke-dasharray="6 5"/><text x="34" y="72" font-size="12" font-weight="700" fill="#7e22ce">model.py — LANGUAGE (no data, no decisions)</text><rect x="40" y="86" width="340" height="92" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="52" y="107" font-size="13.5" font-weight="700" fill="#7e22ce">screen_input()</text><text x="52" y="127.0" font-size="12.5" fill="#1c1917">length cap, control chars, injection phrases,</text><text x="52" y="144.0" font-size="12.5" fill="#1c1917">PII redaction for logs / fallback</text><rect x="40" y="190" width="340" height="110" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="52" y="211" font-size="13.5" font-weight="700" fill="#7e22ce">understand()</text><text x="52" y="231.0" font-size="12.5" fill="#1c1917">rule parser nlu.py: intent, language, ETA,</text><text x="52" y="248.0" font-size="12.5" fill="#1c1917">window, delay, constraints, option, shipment</text><text x="52" y="265.0" font-size="12.5" fill="#1c1917">hints, evidence span; LLM fallback only on</text><text x="52" y="282.0" font-size="12.5" fill="#1c1917">UNKNOWN (Bedrock, JSON schema, validated)</text><rect x="40" y="312" width="340" height="70" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="52" y="333" font-size="13.5" font-weight="700" fill="#7e22ce">missing_facts()</text><text x="52" y="353.0" font-size="12.5" fill="#1c1917">which shipment? what time? → ask first</text><rect x="40" y="394" width="340" height="90" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="52" y="415" font-size="13.5" font-weight="700" fill="#7e22ce">phrase()</text><text x="52" y="435.0" font-size="12.5" fill="#1c1917">reviewed templates EN / HI / Hinglish,</text><text x="52" y="452.0" font-size="12.5" fill="#1c1917">filled only with tool outputs</text><rect x="40" y="496" width="340" height="100" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="52" y="517" font-size="13.5" font-weight="700" fill="#7e22ce">guard_reply()</text><text x="52" y="537.0" font-size="12.5" fill="#1c1917">no booking claim without a commit,</text><text x="52" y="554.0" font-size="12.5" fill="#1c1917">no time no tool produced, no internal ids</text><text x="52" y="571.0" font-size="12.5" fill="#1c1917">→ violation = escalate, never send</text><rect x="430" y="54" width="380" height="560" rx="14" fill="none" stroke="#be185d" stroke-width="1.3" stroke-dasharray="6 5"/><text x="444" y="72" font-size="12" font-weight="700" fill="#be185d">tool.py — DECISIONS (deterministic, contracts)</text><rect x="446" y="86" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="108" font-size="12.5" fill="#1c1917">get_driver_context / find_driver_shipments</text><text x="782" y="108" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="128" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="150" font-size="12.5" fill="#1c1917">get_eta (check-in &gt; ops &gt; WH &gt; driver &gt; plan)</text><text x="782" y="150" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="170" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="192" font-size="12.5" fill="#1c1917">check_slot_feasibility (R1–R8, reasons)</text><text x="782" y="192" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="212" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="234" font-size="12.5" fill="#1c1917">rank_options_lookahead (B&amp;B board cost)</text><text x="782" y="234" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="254" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="276" font-size="12.5" fill="#1c1917">get_booking_status</text><text x="782" y="276" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="296" width="348" height="34" rx="7" fill="#fff" stroke="#be185d"/><text x="458" y="318" font-size="12.5" fill="#1c1917">propose_facility_sequence</text><text x="782" y="318" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">READ</text><rect x="446" y="338" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="360" font-size="12.5" fill="#1c1917">record_eta</text><text x="782" y="360" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><rect x="446" y="380" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="402" font-size="12.5" fill="#1c1917">hold_slot (5 min)</text><text x="782" y="402" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><rect x="446" y="422" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="444" font-size="12.5" fill="#1c1917">confirm_booking (revalidate, idem key)</text><text x="782" y="444" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><rect x="446" y="464" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="486" font-size="12.5" fill="#1c1917">release_hold / notify_warehouse</text><text x="782" y="486" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><rect x="446" y="506" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="528" font-size="12.5" fill="#1c1917">escalate_to_human</text><text x="782" y="528" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><rect x="446" y="548" width="348" height="34" rx="7" fill="#fce7f3" stroke="#be185d"/><text x="458" y="570" font-size="12.5" fill="#1c1917">decide_pending_booking (person only)</text><text x="782" y="570" font-size="11" font-weight="700" fill="#be185d" text-anchor="end">WRITE</text><text x="446" y="600" font-size="11.5" fill="#be185d" font-weight="600" text-anchor="start">call(): known tool · allowed caller · allowed in state · inputs</text><rect x="840" y="54" width="380" height="560" rx="14" fill="none" stroke="#0369a1" stroke-width="1.3" stroke-dasharray="6 5"/><text x="854" y="72" font-size="12" font-weight="700" fill="#0369a1">database.py — FACTS + INTEGRITY</text><rect x="860" y="86" width="340" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="872" y="107" font-size="13.5" font-weight="700" fill="#0369a1">Named queries Q[...]</text><text x="872" y="127.0" font-size="12.5" fill="#1c1917">driver, driver_open_shipments, shipment,</text><text x="872" y="144.0" font-size="12.5" fill="#1c1917">eta_updates, checkin, current_appointment,</text><text x="872" y="161.0" font-size="12.5" fill="#1c1917">facility_slots, live_holds, dock_events,</text><text x="872" y="178.0" font-size="12.5" fill="#1c1917">facility_rules, contacts, ops_messages,</text><text x="872" y="195.0" font-size="12.5" fill="#1c1917">thread, thread_messages, agent_state …</text><rect x="860" y="248" width="340" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="872" y="269" font-size="13.5" font-weight="700" fill="#0369a1">Integrity (enforced by the DB)</text><text x="872" y="289.0" font-size="12.5" fill="#1c1917">BEGIN IMMEDIATE write transactions</text><text x="872" y="306.0" font-size="12.5" fill="#1c1917">unique: one live hold per slot / shipment</text><text x="872" y="323.0" font-size="12.5" fill="#1c1917">idempotency_keys (retry = same result)</text><text x="872" y="340.0" font-size="12.5" fill="#1c1917">inbound_dedupe (re-delivery = once)</text><text x="872" y="357.0" font-size="12.5" fill="#1c1917">prod: Postgres EXCLUDE on dock interval</text><rect x="860" y="410" width="340" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="872" y="431" font-size="13.5" font-weight="700" fill="#0369a1">Tables added</text><text x="872" y="451.0" font-size="12.5" fill="#1c1917">slot_holds, appointment_plan, agent_conversations,</text><text x="872" y="468.0" font-size="12.5" fill="#1c1917">escalations, idempotency_keys, inbound_dedupe,</text><text x="872" y="485.0" font-size="12.5" fill="#1c1917">audit_log</text><rect x="860" y="512" width="340" height="84" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="872" y="533" font-size="13.5" font-weight="700" fill="#0369a1">capture_sql()</text><text x="872" y="553.0" font-size="12.5" fill="#1c1917">statement trace → tables read / written</text><text x="872" y="570.0" font-size="12.5" fill="#1c1917">per turn (situation walkthrough)</text><path d="M380,245 L446,190" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="412" y="208" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">facts</text><path d="M446,300 L380,430" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="412" y="350" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">values to</text><text x="412" y="364" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">phrase</text><path d="M794,200 L860,160" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="828" y="172" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">read</text><path d="M794,400 L860,320" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="828" y="352" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">write txn</text></svg>