<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1c1917">L1 · System context: who talks to the service and what it decides</text><rect x="24" y="70" width="220" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="36" y="91" font-size="13.5" font-weight="700" fill="#b45309">Driver (WhatsApp)</text><text x="36" y="111.0" font-size="12.5" fill="#1c1917">EN · Hindi · Hinglish</text><text x="36" y="128.0" font-size="12.5" fill="#1c1917">reports delay, asks options,</text><text x="36" y="145.0" font-size="12.5" fill="#1c1917">picks a slot, early arrival</text><rect x="24" y="220" width="220" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="36" y="241" font-size="13.5" font-weight="700" fill="#b45309">Gate / yard staff</text><text x="36" y="261.0" font-size="12.5" fill="#1c1917">gate-in, dock-in, unload</text><text x="36" y="278.0" font-size="12.5" fill="#1c1917">start/end (check-ins)</text><rect x="24" y="360" width="220" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="36" y="381" font-size="13.5" font-weight="700" fill="#b45309">Warehouse coordinator</text><text x="36" y="401.0" font-size="12.5" fill="#1c1917">approves PENDING bookings,</text><text x="36" y="418.0" font-size="12.5" fill="#1c1917">handles escalations, sees</text><text x="36" y="435.0" font-size="12.5" fill="#1c1917">control tower (Demo 2)</text><rect x="300" y="56" width="640" height="470" rx="14" fill="none" stroke="#047857" stroke-width="1.3" stroke-dasharray="6 5"/><text x="314" y="74" font-size="12" font-weight="700" fill="#047857">SetuHaul driver exception service (deterministic workflow)</text><rect x="326" y="90" width="180" height="110" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><rect x="326" y="90" width="180" height="26" rx="10" fill="#7e22ce"/><rect x="326" y="106" width="180" height="10" fill="#7e22ce"/><text x="338" y="108" font-size="12.5" font-weight="700" fill="#fff">model.py</text><text x="338" y="137" font-size="13.5" font-weight="700" fill="#7e22ce">Model layer</text><text x="338" y="157.0" font-size="12.5" fill="#1c1917">understand words</text><text x="338" y="174.0" font-size="12.5" fill="#1c1917">ask what is missing</text><text x="338" y="191.0" font-size="12.5" fill="#1c1917">phrase reviewed replies</text><rect x="530" y="90" width="180" height="110" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><rect x="530" y="90" width="180" height="26" rx="10" fill="#be185d"/><rect x="530" y="106" width="180" height="10" fill="#be185d"/><text x="542" y="108" font-size="12.5" font-weight="700" fill="#fff">tool.py</text><text x="542" y="137" font-size="13.5" font-weight="700" fill="#be185d">Tool layer</text><text x="542" y="157.0" font-size="12.5" fill="#1c1917">feasibility, look-ahead,</text><text x="542" y="174.0" font-size="12.5" fill="#1c1917">hold / confirm / release,</text><text x="542" y="191.0" font-size="12.5" fill="#1c1917">escalate, re-plan</text><rect x="734" y="90" width="180" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><rect x="734" y="90" width="180" height="26" rx="10" fill="#0369a1"/><rect x="734" y="106" width="180" height="10" fill="#0369a1"/><text x="746" y="108" font-size="12.5" font-weight="700" fill="#fff">database.py</text><text x="746" y="137" font-size="13.5" font-weight="700" fill="#0369a1">Data layer</text><text x="746" y="157.0" font-size="12.5" fill="#1c1917">named queries,</text><text x="746" y="174.0" font-size="12.5" fill="#1c1917">transactions, unique</text><text x="746" y="191.0" font-size="12.5" fill="#1c1917">indexes, idempotency</text><path d="M506,145 L530,145" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><path d="M710,145 L734,145" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><rect x="326" y="230" width="588" height="96" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/><text x="338" y="251" font-size="13.5" font-weight="700" fill="#047857">Workflow (state machine)</text><text x="338" y="271.0" font-size="12.5" fill="#1c1917">NEW → NEED_SHIPMENT → NEED_ETA → OPTIONS_SHOWN → CONFIRMED | PENDING</text><text x="338" y="288.0" font-size="12.5" fill="#1c1917">any → ESCALATED: safety, asks for a person, no feasible slot, unclear x2</text><text x="338" y="305.0" font-size="12.5" fill="#1c1917">Guardrails on input, on every tool call and on every reply</text><rect x="326" y="350" width="280" height="150" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><rect x="326" y="350" width="280" height="26" rx="10" fill="#be185d"/><rect x="326" y="366" width="280" height="10" fill="#be185d"/><text x="338" y="368" font-size="12.5" font-weight="700" fill="#fff">scheduling_tool.py</text><text x="338" y="397" font-size="13.5" font-weight="700" fill="#be185d">Facility scheduling tool</text><text x="338" y="417.0" font-size="12.5" fill="#1c1917">one facility, all trucks, one objective;</text><text x="338" y="434.0" font-size="12.5" fill="#1c1917">FCFS / EDD / weighted / commitment-</text><text x="338" y="451.0" font-size="12.5" fill="#1c1917">first vs optimal (branch &amp; bound);</text><text x="338" y="468.0" font-size="12.5" fill="#1c1917">proposes, never books</text><rect x="634" y="350" width="280" height="150" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><rect x="634" y="350" width="280" height="26" rx="10" fill="#57534e"/><rect x="634" y="366" width="280" height="10" fill="#57534e"/><text x="646" y="368" font-size="12.5" font-weight="700" fill="#fff">configuration</text><text x="646" y="397" font-size="13.5" font-weight="700" fill="#57534e">rules/rules.yaml</text><text x="646" y="417.0" font-size="12.5" fill="#1c1917">priority weights, buffers, hold TTL,</text><text x="646" y="434.0" font-size="12.5" fill="#1c1917">dock compatibility, 21:00 rule,</text><text x="646" y="451.0" font-size="12.5" fill="#1c1917">solver budgets, RAG thresholds:</text><text x="646" y="468.0" font-size="12.5" fill="#1c1917">every variable configurable</text><rect x="996" y="70" width="220" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="1008" y="91" font-size="13.5" font-weight="700" fill="#0369a1">Freight operations DB</text><text x="1008" y="111.0" font-size="12.5" fill="#1c1917">shipments, slots, docks,</text><text x="1008" y="128.0" font-size="12.5" fill="#1c1917">appointments, check-ins,</text><text x="1008" y="145.0" font-size="12.5" fill="#1c1917">ETA updates, rules, contacts</text><text x="1008" y="162.0" font-size="12.5" fill="#1c1917">(+ holds, idempotency, audit)</text><rect x="996" y="230" width="220" height="100" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="1008" y="251" font-size="13.5" font-weight="700" fill="#57534e">WhatsApp Business API</text><text x="1008" y="271.0" font-size="12.5" fill="#1c1917">inbound webhook,</text><text x="1008" y="288.0" font-size="12.5" fill="#1c1917">approved templates outbound</text><rect x="996" y="360" width="220" height="120" rx="10" fill="#f5f5f4" stroke="#57534e" stroke-width="1.4"/><text x="1008" y="381" font-size="13.5" font-weight="700" fill="#57534e">GPS / FASTag / OSRM</text><text x="1008" y="401.0" font-size="12.5" fill="#1c1917">location on demand (GPS first,</text><text x="1008" y="418.0" font-size="12.5" fill="#1c1917">FASTag toll watchdog second,</text><text x="1008" y="435.0" font-size="12.5" fill="#1c1917">ask driver last)</text><path d="M244,120 L326,140" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="285.0" y="124.0" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">message</text><path d="M326,175 L244,150" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="285" y="180" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">reply</text><path d="M244,250 L276,250 L276,46 L1106,46 L1106,70" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="1010" y="42" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">check-in events</text><path d="M326,290 L244,410" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="270" y="338" font-size="11.5" fill="#6b6560" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">escalation hand-off</text><path d="M244,450 L326,450" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="285" y="470" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">approve /</text><text x="285" y="484" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">reject</text><path d="M914,145 L996,130" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><path d="M996,280 L914,290" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="955" y="275" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">webhook</text><path d="M996,420 L914,420" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><text x="955" y="412" font-size="11.5" fill="#6b6560" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">ETA evidence</text><text x="24" y="548" font-size="12.5" fill="#1c1917" font-weight="600" text-anchor="start">Rule: the model never decides a slot. Tools decide with rules from rules.yaml and the database enforces no double booking. People decide what no safe rule can.</text></svg>