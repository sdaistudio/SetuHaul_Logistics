<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" width="1240" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" font-size="19" font-weight="700" fill="#1c1917">How the work flows: five steps, each ends in a hand-in</text><rect x="24" y="60" width="220" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><text x="36" y="81" font-size="13.5" font-weight="700" fill="#be185d">1 Frame</text><text x="36" y="101.0" font-size="12.5" fill="#1c1917">Problem Definition Sheet</text><text x="36" y="118.0" font-size="12.5" fill="#1c1917">+ data audit (20 issues,</text><text x="36" y="135.0" font-size="12.5" fill="#1c1917">each with its SQL)</text><path d="M244,120 L268,120" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><rect x="268" y="60" width="220" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><text x="280" y="81" font-size="13.5" font-weight="700" fill="#be185d">2 Design</text><text x="280" y="101.0" font-size="12.5" fill="#1c1917">Decision register D1-D13</text><text x="280" y="118.0" font-size="12.5" fill="#1c1917">+ L1 / L2 architecture</text><text x="280" y="135.0" font-size="12.5" fill="#1c1917">(this document)</text><path d="M488,120 L512,120" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><rect x="512" y="60" width="220" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><text x="524" y="81" font-size="13.5" font-weight="700" fill="#be185d">3 Build</text><text x="524" y="101.0" font-size="12.5" fill="#1c1917">Service, tools, slot state:</text><text x="524" y="118.0" font-size="12.5" fill="#1c1917">model.py / tool.py /</text><text x="524" y="135.0" font-size="12.5" fill="#1c1917">database.py + workflow</text><path d="M732,120 L756,120" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><rect x="756" y="60" width="220" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.4"/><text x="768" y="81" font-size="13.5" font-weight="700" fill="#be185d">4 Break</text><text x="768" y="101.0" font-size="12.5" fill="#1c1917">Concurrency + failure tests</text><text x="768" y="118.0" font-size="12.5" fill="#1c1917">on our own system</text><text x="768" y="135.0" font-size="12.5" fill="#1c1917">(10-driver race, replays)</text><path d="M976,120 L1000,120" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)"/><rect x="1000" y="60" width="220" height="120" rx="10" fill="#0b1020" stroke="#0b1020" stroke-width="1.4"/><text x="1012" y="81" font-size="13.5" font-weight="700" fill="#fff">5 Defend</text><text x="1012" y="101.0" font-size="12.5" fill="#e7e5e4">Scenario run (ends in</text><text x="1012" y="118.0" font-size="12.5" fill="#e7e5e4">escalation) + client</text><text x="1012" y="135.0" font-size="12.5" fill="#e7e5e4">readout</text><rect x="490" y="205" width="490" height="54" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-dasharray="6 5"/><text x="506" y="228" font-size="12" fill="#be185d" font-weight="700" text-anchor="start">OPTIONAL EXTENSION (between Build and Break)</text><text x="506" y="247" font-size="12" fill="#1c1917" font-weight="400" text-anchor="start">Facility-level scheduling tool, called by the workflow as a controlled READ tool</text><path d="M735,180 L735,205" fill="none" stroke="#6b6560" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="24" y="300" font-size="12.5" fill="#6b6560" font-weight="400" text-anchor="start">Hand-ins: 1 Problem sheet + audit  ·  2 Decision register  ·  3 Working prototype  ·  4 Scenario run  ·  5 Integrity proof  ·  6 Client readout  ·  + Scheduling tool</text></svg>